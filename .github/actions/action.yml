name: push
description: combine multi-arch image and push
inputs:
  version:
    description: version
    required: true
  latest:
    description: if tag latest
    required: false
  latest_major:
    description: if tag latest major version
    required: false
  workdir:
    description: workdir
    required: true
  tag_suffix:
    description: suffix appended to the minor and major tags of a variant
    required: false
runs:
  using: "composite"
  steps:
    - name: Build image
      env:
        MARIADB_VER: ${{ inputs.version }}
        LATEST: ${{ inputs.latest }}
        LATEST_MAJOR: ${{ inputs.latest_major }}
        TAG_SUFFIX: ${{ inputs.tag_suffix }}
      run: |
        . $GITHUB_ACTION_PATH/release.sh
      shell: bash
      working-directory: ${{ inputs.workdir }}
