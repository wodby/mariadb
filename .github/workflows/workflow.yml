name: Build docker image

on:
  pull_request:
  push:
    branches:
    - master

    tags:
    - '*'
    - '!*-r[0-9]*'

# Runs of one event and branch or tag never overlap, so an older master run
# cannot finish last and move floating tags back. A newer pending run of the
# same event replaces an older one; other events never replace each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_IMAGE_REVISION: r20
  MARIADB123: '12.3.4'
  MARIADB118: '11.8.10'
  MARIADB114: '11.4.14'
  MARIADB1011: '10.11.20'
  # Ubuntu variant: versions of the official mariadb image, which is published
  # some time after a MariaDB release. Their digests are pinned in
  # ubuntu/base-images.mk.
  MARIADB123_UBUNTU: '12.3.3'
  MARIADB118_UBUNTU: '11.8.9'
  MARIADB114_UBUNTU: '11.4.13'

jobs:
  mariadb123-build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and test
        id: build-image
        env:
          MARIADB_VER: ${{ env.MARIADB123 }}
          ARCH: ${{ matrix.arch }}
        working-directory: '12'
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: ./.github/actions/grype
        with:
          image: docker:${{ steps.build-image.outputs.image }}
      - name: Push scanned architecture image
        if: github.event_name == 'push'
        uses: wodby/images/.github/actions/arch-image-push@2da5f02ec3dffc5cb3331152e01e3c89874b0bfe
        with:
          image: ${{ steps.build-image.outputs.image }}
  mariadb123-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - mariadb123-build
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: wodby/images/.github/actions/arch-image-pins@2da5f02ec3dffc5cb3331152e01e3c89874b0bfe
      - uses: ./.github/actions
        with:
          version: ${{ env.MARIADB123 }}
          workdir: 12
          latest: true
          latest_major: true

  mariadb118-build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and test
        id: build-image
        env:
          MARIADB_VER: ${{ env.MARIADB118 }}
          ARCH: ${{ matrix.arch }}
        working-directory: '11'
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: ./.github/actions/grype
        with:
          image: docker:${{ steps.build-image.outputs.image }}
      - name: Push scanned architecture image
        if: github.event_name == 'push'
        uses: wodby/images/.github/actions/arch-image-push@2da5f02ec3dffc5cb3331152e01e3c89874b0bfe
        with:
          image: ${{ steps.build-image.outputs.image }}
  mariadb118-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - mariadb118-build
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: wodby/images/.github/actions/arch-image-pins@2da5f02ec3dffc5cb3331152e01e3c89874b0bfe
      - uses: ./.github/actions
        with:
          version: ${{ env.MARIADB118 }}
          workdir: 11
          latest_major: true

  mariadb114-build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and test
        id: build-image
        env:
          MARIADB_VER: ${{ env.MARIADB114 }}
          ARCH: ${{ matrix.arch }}
        working-directory: '11'
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: ./.github/actions/grype
        with:
          image: docker:${{ steps.build-image.outputs.image }}
      - name: Push scanned architecture image
        if: github.event_name == 'push'
        uses: wodby/images/.github/actions/arch-image-push@2da5f02ec3dffc5cb3331152e01e3c89874b0bfe
        with:
          image: ${{ steps.build-image.outputs.image }}
  mariadb114-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - mariadb114-build
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: wodby/images/.github/actions/arch-image-pins@2da5f02ec3dffc5cb3331152e01e3c89874b0bfe
      - uses: ./.github/actions
        with:
          version: ${{ env.MARIADB114 }}
          workdir: 11

  mariadb1011-build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and test
        id: build-image
        env:
          MARIADB_VER: ${{ env.MARIADB1011 }}
          ARCH: ${{ matrix.arch }}
        working-directory: '10'
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: ./.github/actions/grype
        with:
          image: docker:${{ steps.build-image.outputs.image }}
      - name: Push scanned architecture image
        if: github.event_name == 'push'
        uses: wodby/images/.github/actions/arch-image-push@2da5f02ec3dffc5cb3331152e01e3c89874b0bfe
        with:
          image: ${{ steps.build-image.outputs.image }}
  mariadb1011-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - mariadb1011-build
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: wodby/images/.github/actions/arch-image-pins@2da5f02ec3dffc5cb3331152e01e3c89874b0bfe
      - uses: ./.github/actions
        with:
          version: ${{ env.MARIADB1011 }}
          workdir: 10
          latest_major: true

  # The Ubuntu variant is built on the official image instead of from source.
  ubuntu-setup:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - id: set-matrix
        run: |
          cat << 'EOF' > versions.json
          [
            {"key": "mariadb123-ubuntu", "version": "${{ env.MARIADB123_UBUNTU }}", "latest_major": "1"},
            {"key": "mariadb118-ubuntu", "version": "${{ env.MARIADB118_UBUNTU }}", "latest_major": "1"},
            {"key": "mariadb114-ubuntu", "version": "${{ env.MARIADB114_UBUNTU }}", "latest_major": ""}
          ]
          EOF
          echo "versions=$(jq -c . versions.json)" >> "$GITHUB_OUTPUT"
  ubuntu-build:
    needs: ubuntu-setup
    strategy:
      fail-fast: false
      matrix:
        mariadb: ${{ fromJson(needs.ubuntu-setup.outputs.versions) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and test
        id: build-image
        env:
          MARIADB_VER: ${{ matrix.mariadb.version }}
          ARCH: ${{ matrix.arch }}
        working-directory: ubuntu
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: ./.github/actions/grype
        with:
          image: docker:${{ steps.build-image.outputs.image }}
      - name: Push scanned architecture image
        if: github.event_name == 'push'
        uses: wodby/images/.github/actions/arch-image-push@2da5f02ec3dffc5cb3331152e01e3c89874b0bfe
        with:
          image: ${{ steps.build-image.outputs.image }}
  ubuntu-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - ubuntu-setup
      - ubuntu-build
    strategy:
      matrix:
        mariadb: ${{ fromJson(needs.ubuntu-setup.outputs.versions) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: wodby/images/.github/actions/arch-image-pins@2da5f02ec3dffc5cb3331152e01e3c89874b0bfe
      - uses: ./.github/actions
        with:
          version: ${{ matrix.mariadb.version }}
          workdir: ubuntu
          latest_major: ${{ matrix.mariadb.latest_major }}
          tag_suffix: -ubuntu

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ mariadb123-push, mariadb118-push, mariadb114-push, mariadb1011-push, ubuntu-push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@aee656b81ae84e0dca0cfdbea173057abe4a9426
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
